# Infra locale pour `npm run start:dev` : PostgreSQL + Redis.
#   docker compose up -d
# DATABASE_URL=postgresql://app:app@localhost:5432/app_dev?schema=public
# REDIS_URL=redis://localhost:6379
services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: app-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
